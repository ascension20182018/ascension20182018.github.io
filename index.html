<!-- 春松靈性開悟進取營 - 首頁 (Google Sites 嵌入碼) -->
<!-- 使用方式：Google Sites 編輯 → 插入 → 嵌入 → 嵌入程式碼 → 貼上以下內容 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* === 春松靈性開悟進取營 - 首頁樣式 === */
  .cs-wrapper {
    --cs-warm-cream: #F5EBE0;
    --cs-deep-brown: #2A1810;
    --cs-mid-brown: #5C3D2E;
    --cs-coral: #E07856;
    --cs-coral-dark: #C45A3E;
    --cs-amber: #E8A656;
    --cs-amber-dark: #C48444;
    --cs-terracotta: #C45A3E;
    --cs-soft-shadow: 0 4px 18px rgba(60, 30, 15, 0.18);
    --cs-font-heading: 'Noto Serif TC', 'Source Han Serif TC', 'PingFang TC', 'Microsoft JhengHei', serif;
    --cs-font-body: 'Noto Sans TC', 'Source Han Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;

    font-family: var(--cs-font-body);
    color: var(--cs-deep-brown);
    line-height: 1.7;
    box-sizing: border-box;
    width: 100%;
    overflow-x: hidden;
  }
  .cs-wrapper *, .cs-wrapper *::before, .cs-wrapper *::after {
    box-sizing: border-box;
  }

  /* === 頂部標題與導覽列 === */
  .cs-header {
    background: var(--cs-warm-cream);
    padding: 28px 20px 24px;
    text-align: center;
    border-bottom: 1px solid rgba(196, 90, 62, 0.18);
  }
  .cs-site-title {
    font-family: var(--cs-font-heading);
    font-size: clamp(22px, 3.4vw, 32px);
    font-weight: 700;
    color: var(--cs-deep-brown);
    margin: 0 0 6px 0;
    letter-spacing: 4px;
    line-height: 1.3;
  }
  .cs-site-subtitle {
    font-size: 13px;
    color: var(--cs-mid-brown);
    letter-spacing: 6px;
    margin-bottom: 18px;
    opacity: 0.75;
  }
  .cs-nav-divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin: 16px auto 14px;
    max-width: 720px;
  }
  .cs-nav-divider::before,
  .cs-nav-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--cs-terracotta), transparent);
    opacity: 0.55;
    max-width: 180px;
  }
  .cs-nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px 4px;
    padding: 0 12px;
    list-style: none;
    margin: 0;
  }
  .cs-nav-item {
    font-family: var(--cs-font-body);
    font-size: 14px;
    color: var(--cs-mid-brown);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 18px;
    transition: all 0.25s ease;
    letter-spacing: 1.5px;
    white-space: nowrap;
    display: inline-block;
  }
  .cs-nav-item:hover {
    background: rgba(224, 120, 86, 0.15);
    color: var(--cs-coral-dark);
    transform: translateY(-1px);
  }
  .cs-nav-item.is-active {
    background: var(--cs-coral);
    color: #fff;
    box-shadow: var(--cs-soft-shadow);
  }

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
    text-align: center;
    overflow: hidden;
  }
  .cs-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, rgba(40, 25, 15, 0.35) 0%, rgba(20, 12, 8, 0.65) 100%),
      linear-gradient(to bottom, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0.45) 100%);
    z-index: 1;
  }
  .cs-hero-content {
    position: relative;
    z-index: 2;
    max-width: 880px;
    width: 100%;
  }
  .cs-hero-text {
    color: #fff;
    font-family: var(--cs-font-heading);
    font-weight: 700;
    text-shadow: 0 2px 16px rgba(0,0,0,0.65), 0 1px 3px rgba(0,0,0,0.8);
    line-height: 1.55;
    margin: 0 0 40px 0;
  }
  .cs-hero-line {
    display: block;
    margin: 6px 0;
  }
  .cs-hero-line-1 {
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 6px;
  }
  .cs-hero-line-2 {
    font-size: clamp(18px, 2.8vw, 26px);
    letter-spacing: 4px;
    font-weight: 500;
    opacity: 0.95;
    margin: 12px 0;
  }
  .cs-hero-line-3 {
    font-size: clamp(22px, 3.6vw, 32px);
    letter-spacing: 5px;
  }
  .cs-hero-divider {
    width: 60px;
    height: 2px;
    background: var(--cs-amber);
    margin: 28px auto;
    border-radius: 2px;
    opacity: 0.85;
  }

  /* === CTA 按鈕 === */
  .cs-cta-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    margin-top: 8px;
  }
  .cs-cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    min-width: 220px;
