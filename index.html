    flex-direction: column;
    align-items: center;
    gap: 16px;

    display: inline-flex;

    justify-content: center;

    min-width: 220px;
    padding: 14px 36px;
    font-family: var(--cs-font-body);
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #fff;
    text-decoration: none;
    border-radius: 32px;
    border: none;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.25), 0 2px 6px rgba(0,0,0,0.15);
    position: relative;
    overflow: hidden;
  }
  .cs-cta-primary {
    background: linear-gradient(135deg, var(--cs-coral) 0%, var(--cs-coral-dark) 100%);
  }
  .cs-cta-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(196, 90, 62, 0.5), 0 4px 10px rgba(0,0,0,0.2);

  .cs-cta-secondary {

    transform: translateY(-2px);
